# Stellar v2 配置。完整字段与默认值见 node_modules/hexo-theme-stellar/_config.yml
# 这里只写与默认值不同的部分；数组会整体替换默认值。

leftbar:
  brand:
    image:
      src: https://avatars.githubusercontent.com/u/7054676?v=4
      variant: avatar
    name: Manjusaka
    tagline: 写代码的香港记者
  menu:
    - id: post
      title: 博客
      icon: default:documents
      url: /
    - id: weekly
      title: 周报
      icon: default:notebook
      url: /weekly/
    - id: leetcode
      title: 刷题
      icon: default:fire
      url: /leetcode/
    - id: categories
      title: 分类
      icon: default:category
      url: /categories/
    - id: tags
      title: 标签
      icon: default:hashtag
      url: /tags/
    - id: archives
      title: 归档
      icon: default:calendar
      url: /archives/
    - id: about
      title: 关于
      icon: default:profile
      url: /about/
  footer:
    actions:
      - type: link
        icon: default:github
        title: GitHub
        url: https://github.com/Zheaoli
      - type: link
        icon: share:x
        title: X
        url: https://twitter.com/Manjusaka_Lee
      - type: link
        icon: share:email
        title: Email
        url: mailto:me@manjusaka.me
      - type: link
        icon: default:rss
        title: RSS
        url: /atom.xml

footer:
  sitemap:
    - title: 博客
      items:
        - '[近期发布](/)'
        - '[分类](/categories/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 笔记
      items:
        - '[周报](/weekly/)'
        - '[刷题](/leetcode/)'
    - title: 社交
      items:
        - '[GitHub](https://github.com/Zheaoli)'
        - '[X](https://twitter.com/Manjusaka_Lee)'
        - '[Email](mailto:me@manjusaka.me)'
    - title: 订阅
      items:
        - '[RSS](/atom.xml)'
        - '[关于我](/about/)'
  content: |
    © 2020 - 2026 [{author.name}](/) · 由 [{theme.name} {theme.version}]({theme.tree}) 驱动。
    除特别声明外，本站文章均采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。

profiles:
  # 首页右栏默认是空的，宽屏下右侧会留一大片空白
  home:
    rightbar:
      widgets:
        - tagcloud
  # 周报、刷题两个笔记本已经在左侧菜单里，不需要“全部笔记本”索引页
  notebooks:
    path: null
  post:
    rightbar:
      widgets:
        - toc

appearance:
  colors:
    # 曼珠沙华（红花石蒜）的红，和头像、站名呼应；主题默认是青色
    primary: hsl(352 74% 52%)
    accent: hsl(28 92% 52%)
    link: hsl(352 70% 46%)
  typography:
    font_family:
      # 中文优先落到各平台的黑体，而不是 system-ui 的回退结果
      body: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Source Han Sans SC", "Microsoft YaHei", "Segoe UI", sans-serif
      code: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Monaco, Consolas, monospace
  backgrounds:
    leftbar:
      gradient:
        light:
          - hsl(352 60% 88%)
          - hsl(18 70% 88%)
          - hsl(340 45% 84%)
          - hsl(35 90% 88%)
        dark:
          - hsl(352 30% 34%)
          - hsl(18 28% 36%)
          - hsl(340 22% 32%)
          - hsl(35 30% 38%)

article:
  style: tech
  listing:
    # hero 是整幅题图压标题，一屏只能看到不到两篇；classic 是题图在侧、标题和摘要在旁
    card_layout: classic
    show_tags: true
  show_reading_time: true
  related_posts_limit: 0 # 开启需要另装 hexo-related-popular-posts
  footer:
    license: 本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。
    share:
      - qrcode
      - weibo
      - x
      - telegram
      - email

search:
  # Butterfly 时期用的是 Algolia，但站点配置里缺 apiKey；验证阶段先用本地搜索
  provider: local

comments:
  provider: giscus
  title: 参与讨论
  # 参数取自 https://giscus.app/zh-CN 生成的结果
  giscus:
    data-repo: Zheaoli/zheaoli.github.io
    data-repo-id: MDEwOlJlcG9zaXRvcnk2Mzk3MjI3MQ==
    data-category: General
    data-category-id: DIC_kwDOA9Ajr84DL0rq
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: lazy

features:
  color_scheme_switch:
    enabled: true
  lightbox:
    enabled: true
    selector: '.md-text img:not([class]), .timenode p>img'
  diagrams:
    provider: mermaid

open_graph:
  enabled: true
  twitter_id: Manjusaka_Lee

structured_data:
  same_as:
    - https://github.com/Zheaoli
    - https://twitter.com/Manjusaka_Lee

inject:
  # 站点自己的样式补丁，见 source/css/site.css
  head_end: '<link rel="stylesheet" href="/css/site.css">'
  # 正文图片是懒加载的：加载前 src 是一张 1x1 的占位图，浏览器会按 1:1 给它留位置，
  # 于是每张图加载完都要把下面的内容顶一下。主题已经把真实宽高写进了 width/height，
  # 这里据此固定宽高比，图片没到之前就留出正确的高度。
  body_end: >-
    <script>document.querySelectorAll('.md-text img[width][height]').forEach(function(i){var w=+i.getAttribute('width'),h=+i.getAttribute('height');if(w>0&&h>0)i.style.aspectRatio=w+' / '+h})</script>

# 预连接页面必然会用到的第三方源
preconnect:
  - https://gcore.jsdelivr.net
  - https://cdn.pixabay.com
  - https://avatars.githubusercontent.com
  - https://giscus.app

# 不使用主题的 canonical：它的克隆站检测会先去掉当前域名的 www 再和 host 比较，
# 所以 host 只能填裸域名 manjusaka.blog；而裸域名会 308 跳到 www，
# 填了之后规范链接指向的是跳转地址，不填 www 又会把正式站点判成克隆站。
# 规范链接改由 scripts/canonical.js 按站点 url 输出。
canonical:
  host: null
