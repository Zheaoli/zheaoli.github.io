title: Manjusaka
subtitle: 写代码的香港记者
description: 你们有一个好，遇到点新鲜的东西，跑的比谁都快
author: Manjusaka
language: en
timezone: Asia/Chongqing
url: https://www.manjusaka.blog
root: /
permalink: /posts/:year/:month/:day/:title/
permalink_defaults: null
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: ':lang'
skip_render: null
new_post_name: ':title.md'
default_layout: post
titlecase: false
external_link: true
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: null
  exclude_languages: ['mermaid']
default_category: uncategorized
category_map: null
tag_map: null
date_format: YYYY-MM-DD
time_format: HH:mm:ss
# 没写 updated 的文章用发布日期，而不是文件修改时间（CI 每次检出都会刷新修改时间）
updated_option: date
per_page: 10
pagination_dir: page
theme: stellar
feed:
  type: atom
  path: atom.xml
  limit: 20
deploy:
  type: git
  repo: git@github.com:Zheaoli/zheaoli.github.io.git
  branch: master
algolia:
  appId: "DL1RURGHTB"
  chunkSize: 5000
  indexName: "manjusaka.blog"
  fields:
    post_fields:
      - content:strip:truncate,0,500
      - excerpt:strip
      - gallery
      - permalink
      - photos
      - slug
      - tags
      - title
    page_fields:
      - content:strip:truncate,0,500
      - excerpt:strip
      - slug
      - title
      - permalink
      - path
# 没有 cover 的文章从这里挑一张做题图（沿用 Butterfly 时期的 default_cover）。
# `hexo new` 新建文章时自动写入；存量文章用 `hexo cover-fill` 补齐。
default_covers:
  - https://cdn.pixabay.com/photo/2023/02/08/15/10/sculpture-7776861_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/06/16/46/sea-7772372_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/07/14/45/snow-7774312_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/06/01/14/superb-fairywren-7770904_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/04/07/50/flower-7766608_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/04/07/38/cherry-blossoms-7766588_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/04/07/38/cherry-blossoms-7766587_1280.jpg
  - https://cdn.pixabay.com/photo/2023/02/04/07/50/daisy-7766609_1280.jpg
  - https://cdn.pixabay.com/photo/2023/01/14/19/50/flower-7718952_1280.jpg
  - https://cdn.pixabay.com/photo/2023/01/30/19/40/gulls-7756481_1280.jpg
